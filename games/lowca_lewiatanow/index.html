<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Łowca Lewiatanów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Jeden ekran: ocean na canvasie, nad nim pływające panele HUD i karty w kolorach głębin */
:root{
  --abyss:#04182c; --panel:#0b2c48; --panel2:#123c60; --line:#2a5a80;
  --ink:#eaf6ff; --muted:#93b6cf; --gold:#ffc94a; --coral:#ff6b5a; --kelp:#5fd39a;
  --fd:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --fb:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--abyss);color:var(--ink);font-family:var(--fb);-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font-family:var(--fd);letter-spacing:.02em;cursor:pointer;border:0;color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.wallet{display:flex;flex-direction:column;gap:4px}
.coins{display:flex;align-items:center;gap:8px;background:rgba(4,24,44,.78);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;font-family:var(--fd);font-size:22px;font-variant-numeric:tabular-nums}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,var(--gold) 45%,#c98a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
#locname{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:8px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btns button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btns button:hover{background:var(--panel2)}
.btns button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#bShop{background:#7a4a10;border-color:var(--gold);color:#fff3d0}
#bShop:hover{background:#94591a}
#reel{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffdf7a,var(--gold) 50%,#c07d0c);color:#4a2a00;font-size:19px;box-shadow:0 6px 0 #7a4a06,0 10px 24px rgba(0,0,0,.4);touch-action:none}
#reel.on{transform:translateY(4px);box-shadow:0 2px 0 #7a4a06,0 6px 14px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(90vw,460px);text-align:center;
  background:rgba(4,24,44,.9);border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800;font-size:15px;pointer-events:none;transition:opacity .3s;opacity:0}
#toast.show{opacity:1}
#toast.warn{border-color:var(--coral);color:#ffd9d3}
#modal{position:fixed;inset:0;background:rgba(2,10,20,.66);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:3px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--panel);border-bottom:2px solid var(--line);z-index:1}
.card h2{margin:0;font-family:var(--fd);font-weight:800;font-size:28px;letter-spacing:.02em}
#mClose{background:var(--panel2);border-radius:10px;width:40px;height:40px;font-size:20px}
#mBody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.up{background:var(--abyss);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.up h3{margin:0;font-family:var(--fd);font-weight:800;font-size:20px;color:var(--gold);letter-spacing:.03em}
.pips{display:flex;gap:3px;justify-self:end;flex-wrap:wrap;max-width:200px}
.pips i{width:11px;height:11px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.pips i.on{background:var(--kelp);border-color:var(--kelp)}
.now,.nxt{grid-column:1/-1;font-size:14px;color:var(--muted)}
.now b,.nxt b{color:var(--ink)}
.buy{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.buy button,.act{background:var(--kelp);color:#06301c;border-radius:12px;padding:9px 16px;font-size:17px;box-shadow:0 3px 0 #2a7a52}
.buy button:disabled,.act:disabled{background:#33506a;color:#8aa6bb;box-shadow:none;cursor:not-allowed}
.maxed{color:var(--kelp);font-weight:900}
.zone{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--abyss);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.zone.here{border-color:var(--gold)}
.zone h3{margin:0;font-family:var(--fd);font-weight:800;font-size:20px}
.zone p{margin:0;grid-column:1;font-size:13px;color:var(--muted)}
.zone .act{grid-row:1/span 2;grid-column:2}
.ztag{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{background:var(--abyss);border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fc.leg{border-color:var(--gold)}
.fc canvas{width:100%;height:auto;aspect-ratio:16/9;display:block}
.fc b{font-size:14px;line-height:1.2}
.fc small{font-size:12px;color:var(--muted);line-height:1.3}
.ahead{font-family:var(--fd);font-size:18px;color:var(--gold);margin:6px 0 -4px;letter-spacing:.03em}
.catch{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.catch canvas{width:100%;max-width:460px;height:auto;aspect-ratio:2/1}
.catch .nm{font-family:var(--fd);font-size:30px;line-height:1.1;text-wrap:balance}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel2)}
.tag.new{background:var(--kelp);color:#06301c}.tag.rec{background:var(--gold);color:#4a2a00}.tag.leg{background:var(--coral);color:#3a0700}
.stats{display:flex;gap:18px;justify-content:center;font-size:15px;color:var(--muted);flex-wrap:wrap}
.stats b{display:block;font-family:var(--fd);font-weight:800;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.win{background:linear-gradient(135deg,#7a4a10,#3b1f05);border:2px solid var(--gold);border-radius:14px;padding:12px;font-weight:800}
@media (max-width:520px){
  .btns button{padding:7px 9px;font-size:14px}
  .coins{font-size:18px}
  #reel{width:88px;height:88px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

  for(let i=0;i<9;i++){const a=Math.PI*.55+i/8*Math.PI*.9,x=-L*.05+Math.cos(a)*L*.3,y=Math.sin(a)*H*.4;c.lineWidth=H*.06;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x-L*.12,y+Math.sin(t*2+i)*H*.15,x-L*.2,y+Math.sin(t*2.5+i)*H*.2);c.stroke()}
  c.fillStyle=bodyGrad(c,H,sp.c1,sp.c2);c.beginPath();c.ellipse(-L*.04,0,L*.34,H*.46,0,0,7);c.fill();
  c.fillStyle=shade(sp.c2,.2);for(let i=0;i<18;i++){c.beginPath();c.arc(-L*(.3-hash(i)*.45),-H*(.4-hash(i+7)*.5),L*(.004+.012*hash(i+3)),0,7);c.fill()}
  const mx=L*.26,rx=L*.09,ry=H*.36,op=1+Math.sin(t*1.8)*.06;
  const mg=c.createRadialGradient(mx,0,0,mx,0,ry);mg.addColorStop(0,'#000');mg.addColorStop(.6,'#2a0610');mg.addColorStop(1,'#6a1a22');
  c.fillStyle=mg;c.beginPath();c.ellipse(mx,0,rx*op,ry*op,0,0,7);c.fill();
  c.fillStyle='#efe6cf';
  for(let j=0;j<3;j++){const sc=(1-j*.28)*op;for(let i=0;i<16;i++){const a=i/16*Math.PI*2+j*.2+t*.3*(j%2?-1:1),cx=mx+Math.cos(a)*rx*sc,cy=Math.sin(a)*ry*sc,ix=mx+Math.cos(a)*rx*sc*.72,iy=Math.sin(a)*ry*sc*.72,tx=-Math.sin(a)*rx*.12,ty=Math.cos(a)*ry*.07;
    c.beginPath();c.moveTo(cx+tx,cy+ty);c.lineTo(ix,iy);c.lineTo(cx-tx,cy-ty);c.fill()}}
  for(let i=0;i<4;i++)sharkEye(c,L*(-.02+i*.06),-H*(.36-i*.03),Math.max(1.5,H*.035));
}
function drawHippo(c,sp,L,H,t){
  const N=20,P=[];
  for(let i=0;i<=N;i++){const u=i/N;P.push([L*(.16-u*.62),H*(.1+u*.35)+Math.sin(u*5-t*4)*H*.35*u,H*.32*(1-u*.85)])}
  const legs=k=>{const ph=t*3+k*1.5,ax=L*.2-k*L*.05,ay=H*.25,kx=ax+Math.cos(ph)*L*.06+L*.04,ky=ay+H*.35,fx2=kx+L*.05+Math.sin(ph)*L*.04,fy2=ky+H*.3;
    c.strokeStyle=k?shade(sp.c1,-.3):sp.c1;c.lineWidth=Math.max(2,H*.12);c.lineCap='round';c.beginPath();c.moveTo(ax,ay);c.lineTo(kx,ky);c.lineTo(fx2,fy2);c.stroke();
    c.fillStyle=sp.c3;c.beginPath();c.moveTo(fx2,fy2);c.lineTo(fx2+L*.06,fy2+H*.08);c.lineTo(fx2-L*.01,fy2+H*.15);c.fill()};
  legs(1);
  const[tx,ty]=P[N];c.fillStyle=shade(sp.c1,-.15);c.beginPath();c.moveTo(tx+L*.02,ty);c.quadraticCurveTo(tx-L*.06,ty-H*.5,tx-L*.1,ty-H*.45);c.quadraticCurveTo(tx-L*.05,ty,tx-L*.1,ty+H*.5);c.quadraticCurveTo(tx-L*.05,ty+H*.4,tx+L*.02,ty);c.fill();
  c.fillStyle=sp.c3;for(let i=4;i<16;i+=2){const[x,y,w]=P[i];c.beginPath();c.moveTo(x+L*.02,y-w*.9);c.lineTo(x-L*.01,y-w-H*.18);c.lineTo(x-L*.02,y-w*.9);c.fill()}
  c.fillStyle=bodyGrad(c,H,sp.c1,sp.c2);
  c.beginPath();P.forEach(([x,y,w],i)=>i?c.lineTo(x,y-w):c.moveTo(x,y-w));for(let i=N;i>=0;i--){const[x,y,w]=P[i];c.lineTo(x,y+w)}c.fill();
  c.beginPath();c.moveTo(L*.1,H*.4);c.quadraticCurveTo(L*.32,H*.4,L*.3,-H*.05);c.quadraticCurveTo(L*.3,-H*.45,L*.22,-H*.7);c.lineTo(L*.08,-H*.55);c.quadraticCurveTo(L*.02,-H*.1,-L*.02,H*.2);c.closePath();c.fill();
  c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=Math.max(.6,H*.03);for(let i=2;i<N;i++){const[x,y,w]=P[i];c.beginPath();c.arc(x,y,w*.5,Math.PI*.3,Math.PI*.7);c.stroke()}
  c.fillStyle=sp.c3;for(let i=0;i<6;i++){const u=i/5,x=lerp(L*.22,L*.05,u),y=lerp(-H*.82,-H*.3,u);c.beginPath();c.moveTo(x,y);c.lineTo(x-L*.06,y-H*.25+Math.sin(t*4+i)*H*.08);c.lineTo(x-L*.02,y+H*.12);c.fill()}
  c.save();c.translate(L*.28,-H*.7);c.rotate(.5+Math.sin(t*2)*.05);c.fillStyle=sp.c1;
  c.beginPath();c.ellipse(0,0,L*.08,H*.2,0,0,7);c.fill();
  c.beginPath();c.moveTo(L*.02,-H*.14);c.quadraticCurveTo(L*.2,-H*.1,L*.22,H*.04);c.quadraticCurveTo(L*.2,H*.16,L*.04,H*.16);c.fill();
  c.beginPath();c.moveTo(-L*.02,-H*.15);c.lineTo(-L*.01,-H*.4);c.lineTo(L*.03,-H*.16);c.fill();
  c.fillStyle='#123';c.beginPath();c.arc(L*.19,-H*.01,Math.max(1,H*.025),0,7);c.fill();
  eye(c,L*.04,-H*.05,Math.max(1.5,H*.07));c.restore();
  legs(0);
}
function drawFish(c,sp,L,t){
  const H=L*(sp.h||.3);
  switch(sp.s){
    case'ryba':drawRyba(c,sp,L,H,t);break;case'plaska':drawPlaska(c,sp,L,H,t);break;case'weg':drawWeg(c,sp,L,H,t);break;
    case'rekin':drawRekin(c,sp,L,H,t);break;case'miecz':drawMiecz(c,sp,L,H,t);break;case'kalmar':drawKalmar(c,sp,L,H,t);break;
    case'zabnica':drawZabnica(c,sp,L,H,t);break;case'amonit':drawAmonit(c,sp,L,H,t);break;case'pancerna':drawPancerna(c,sp,L,H,t);break;
    case'gad':drawGad(c,sp,L,H,t);break;
    case'waz':drawWaz(c,sp,L,H,t);break;case'kraken':drawKraken(c,sp,L,H,t);break;case'scylla':drawScylla(c,sp,L,H,t);break;
    case'charybda':drawCharybda(c,sp,L,H,t);break;case'hippokamp':drawHippo(c,sp,L,H,t);break;

function fishThumb(cvs,sp,known,big){

const G={state:'idle',t:0,camY:0,hook:{x:0,y:0,d:0},cast:null,fish:[],fight:null,parts:[],shake:0,spawnT:0,hintT:0,rejT:0,bossT:0,snow:[]};
for(let i=0;i<90;i++)G.snow.push({x:Math.random(),y:Math.random(),z:rnd(.3,1),r:rnd(.6,1.8)});
const Z=()=>ZONES[S.loc];
const maxDepth=()=>Math.min(LINES[S.line].d,Z().depth-1);
let boatX=0,tip={x:0,y:0};

function spawnFish(initial){
  const z=Z(),top=Math.max(1,(G.camY-H*.3)/PPM),bot=Math.min(z.depth-2,(G.camY+H*1.3)/PPM);
  if(bot<=top)return;
  const cand=SP.filter(s=>s.z.includes(z.id)&&s.d[1]>top&&s.d[0]<bot&&s.d[0]<z.depth);
  if(!cand.length)return;
  let tot=cand.reduce((a,s)=>a+s.r,0),r=Math.random()*tot,sp=cand[0];
  for(const s of cand){r-=s.r;if(r<=0){sp=s;break}}
  if(sp.boss&&G.fish.filter(f=>f.sp.boss).length>=(z.id===4?2:1))return;
  const tw=Math.pow(Math.random(),1.6),L=sp.L*(.85+.3*tw);
  const d=rnd(Math.max(top,sp.d[0]),Math.min(bot,sp.d[1],z.depth-2));
  const dir=Math.random()<.5?1:-1;
  const x=initial?rnd(0,W):(dir>0?-L*.7-20:W+L*.7+20);
  G.fish.push({sp,L,tw,dir,x,y:d*PPM,y0:d*PPM,ph:rnd(0,6),spd:(sp.boss?rnd(35,55):rnd(30,75))*(sp.s==='amonit'?.5:1),
    w:lerp(sp.w[0],sp.w[1],tw),p:sp.p*(.8+.4*tw),checked:false,chase:false,t:rnd(0,9),turnT:rnd(4,12)});
  if(sp.boss&&!initial&&G.bossT<=0){G.bossT=25;G.shake=10;SFX.boss();toast(`Woda drży… gigant pojawił się na ${Math.round(d)} m!`,true)}
}
function mouthOff(f){return f.L*(MOUTH[f.sp.s]||.49)}
function mouthYOff(f){return (MOUTHY[f.sp.s]||0)*f.L*(f.sp.h||.3)}

function cast(){
  if(G.state!=='idle'||modalOpen())return;
  audioInit();
  G.state='cast';G.cast={t:0,x0:tip.x,y0:tip.y,x1:clamp(tip.x+rnd(50,110),30,W-30)};
  S.casts++;tone(900,.18,'sine',.06,300);
}
function startFight(f){
  G.state='fight';
  const k=f.p/RODS[S.rod].p;
  G.fight={f,dist:G.hook.d,tension:10,thrash:0,next:rnd(1,2.5),vx:f.dir,k,stam:1};
  f.chase=false;SFX.bite();
  G.parts.push({kind:'excl',x:G.hook.x,y:G.hook.y,t:0});
  if(k>1.6)toast('Ta ryba jest za silna dla Twojej wędki! Spróbuj ostrożnie…',true);
  else if(f.sp.boss)toast('To gigant! Zwijaj ostrożnie, nie zerwij żyłki!',true);
}
function endFight(msg){toast(msg,true);SFX.snap();const f=G.fight.f;f.chase=false;f.checked=true;f.dir=f.x<W/2?-1:1;f.spd*=2.2;f.flee=1;G.fish.push(f);G.fight=null;G.state='line';G.hook.d=Math.max(0,G.hook.d)}
function landFish(){
  const f=G.fight.f,sp=f.sp;G.fight=null;G.state='idle';
  const price=Math.round(sp.v*(.6+.8*f.tw)*MARKETS[S.market].m);
  const rec=S.atlas[sp.id],isNew=!rec,isRec=rec&&f.w>rec.best;
  S.atlas[sp.id]={n:(rec?rec.n:0)+1,best:Math.max(rec?rec.best:0,f.w)};
  const bonus=isNew?price:0;S.coins+=price+bonus;save();updHud();
  for(let i=0;i<24;i++)G.parts.push({kind:'drop',x:boatX+rnd(-40,90),y:rnd(-10,0),vx:rnd(-120,120),vy:rnd(-260,-80),t:0});
  if(sp.legend)SFX.legend();else SFX.catch();setTimeout(()=>SFX.coin(),350);
  const won=!S.won&&S.atlas.mega&&S.atlas.moza;if(won){S.won=1;save()}
  showCatch(f,price,isNew,isRec,won,bonus);
}

let pHold=false,bHold=false,kHold=false,steerX=null,keyDir=0;
const reeling=()=>pHold||bHold||kHold;
cv.addEventListener('pointerdown',e=>{if(modalOpen())return;audioInit();steerX=e.clientX;
  if(G.state==='idle'){cast();return}
  if(e.pointerType==='mouse'||G.state==='fight')pHold=true;

});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)steerX=e.clientX});

const RB=$('reel');
RB.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(G.state==='idle'){cast();return}bHold=true;RB.classList.add('on');try{RB.setPointerCapture(e.pointerId)}catch(_){}});

  if((e.code==='ArrowLeft'||e.code==='KeyA')&&keyDir<0)keyDir=0;if((e.code==='ArrowRight'||e.code==='KeyD')&&keyDir>0)keyDir=0});

document.addEventListener('contextmenu',e=>{if(!modalOpen())e.preventDefault()});

// ================== AKTUALIZACJA ==================
let reelTick=0;
function update(dt){
  G.t+=dt;G.bossT-=dt;G.rejT-=dt;
  const z=Z(),hk=G.hook;
  boatX=W*.42;
  const md=maxDepth();
  // sterowanie haczykiem
  const steer=()=>{let tx=steerX??hk.x;if(keyDir){tx=hk.x+keyDir*200;steerX=null}hk.x+=clamp(tx-hk.x,-220*dt,220*dt);hk.x=clamp(hk.x,16,W-16)};
  if(G.state==='idle'){hk.x=tip.x;hk.y=tip.y;hk.d=0}
  else if(G.state==='cast'){const c=G.cast;c.t+=dt*2.2;const u=Math.min(1,c.t);hk.x=lerp(c.x0,c.x1,u);hk.y=lerp(c.y0,0,u)-Math.sin(u*Math.PI)*70;
    if(u>=1){G.state='line';hk.d=0;hk.y=0;SFX.splash();G.parts.push({kind:'ring',x:hk.x,y:0,t:0});for(let i=0;i<10;i++)G.parts.push({kind:'drop',x:hk.x,y:0,vx:rnd(-80,80),vy:rnd(-200,-60),t:0})}}
  else if(G.state==='line'){
    steer();
    if(reeling()){hk.d-=Math.max(REELS[S.reel].s*1.6,14)*dt;reelTick+=dt;if(reelTick>.07){reelTick=0;SFX.click()}
      if(hk.d<=0){G.state='idle';hk.d=0}}
    else{if(hk.d<md-.5&&Math.random()<dt*12)G.parts.push({kind:'bub',x:hk.x+rnd(-3,3),y:hk.y,t:0});hk.d=Math.min(md,hk.d+(S.loc<=1?Math.max(30,md/4):Math.max(14,md/10))*dt)}
    hk.y=hk.d*PPM;
  }
  else if(G.state==='fight'){
    const F=G.fight,f=F.f,k=Math.max(.12,F.k);
    F.next-=dt;
    if(F.thrash>0){F.thrash-=dt}else if(F.next<=0){F.thrash=rnd(.5,1.2)*(f.sp.boss?1.5:1);F.next=rnd(1.4,3.6)/(.6+Math.min(k,1.5)*.4)/(f.sp.ultra?1.15:1);if(f.sp.boss)G.shake=Math.max(G.shake,6)}
    const th=F.thrash>0;
    if(reeling()){
      F.tension+=(26*k+(th?75*k:0))*BRAKES[S.brake].f*(f.sp.ultra?1.1:1)*dt;
      F.dist-=REELS[S.reel].s*dt*(th?.3:1)*clamp(1.25-.35*k,.35,1);if(th&&f.sp.ultra)F.dist+=2*dt;
      reelTick+=dt;if(reelTick>(th?.04:.06)){reelTick=0;SFX.click()}
    }else{
      F.tension-=42*dt;
      F.dist+=((th?6:1.6)*Math.min(k,2)*(f.sp.ultra?2.6:f.sp.boss?2.2:1))*dt;
    }
    F.tension=clamp(F.tension,0,110);
    F.dist=Math.min(F.dist,z.depth-1);
    F.vx=f.dir;hk.x+=f.dir*(th?110:45)*dt;
    if(hk.x<50){hk.x=50;f.dir=1}if(hk.x>W-50){hk.x=W-50;f.dir=-1}
    if(Math.random()<dt*.4)f.dir*=-1;
    hk.d=F.dist;hk.y=F.dist*PPM;
    f.x=hk.x-f.dir*mouthOff(f);f.y=hk.y-mouthYOff(f);f.t+=dt*(th?2.5:1.3);
    if(F.tension>=100)endFight('Trzask! Żyłka pękła — ryba odpłynęła.');
    else if(F.dist>LINES[S.line].d+5)endFight('Zabrakło żyłki — ryba uciekła!');
    else if(F.dist<=0.3)landFish();
  }
  // ryby
  G.spawnT-=dt;
  const target=9+z.id*1.5;
  const win0=G.camY-H*.6,win1=G.camY+H*1.6;
  const inWin=G.fish.filter(f=>f.y>win0&&f.y<win1).length;
  if(G.spawnT<=0&&inWin<target){spawnFish(false);G.spawnT=rnd(.25,.7)}
  for(const f of G.fish){
    f.t+=dt;
    const mx=f.x+f.dir*mouthOff(f);
    if(G.state==='line'&&!f.checked&&!f.flee){
      const dx=hk.x-mx,dy=hk.y-f.y-mouthYOff(f),dist=Math.hypot(dx,dy);
      if(dist<(110+f.L*.4)*HOOKS[S.hook].r){f.checked=true;
        if(S.bait>=f.sp.b&&Math.random()<HOOKS[S.hook].a)f.chase=true;
        else if(S.bait<f.sp.b&&G.rejT<=0&&(f.sp.b-S.bait)<=2){G.rejT=7;toast(`${S.atlas[f.sp.id]?f.sp.n:'Ta ryba'} ignoruje Twoją przynętę. Potrzebujesz lepszej!`)}}
    }
    if(f.chase&&G.state==='line'){
      const dx=hk.x-mx,dy=hk.y-f.y-mouthYOff(f),dist=Math.hypot(dx,dy);
      if(dist>260+f.L){f.chase=false}
      else{f.turnCd=(f.turnCd||0)-dt;const dc=hk.x-f.x;if(f.turnCd<=0&&Math.abs(dc)>12&&Math.sign(dc)!==f.dir){f.dir=Math.sign(dc);f.turnCd=.8}const sp=f.spd*1.3;f.x+=clamp(dx,-sp*dt,sp*dt);f.y+=clamp(dy,-sp*.7*dt,sp*.7*dt);
        if(dist<8+f.L*.04){G.fish.splice(G.fish.indexOf(f),1);startFight(f);break}}
    }else{
      if(f.chase)f.chase=false;
      f.x+=f.dir*f.spd*dt;f.y=lerp(f.y,f.y0+Math.sin(f.t*.8+f.ph)*8,dt*2);
      f.turnT-=dt;if(f.turnT<=0&&!f.flee&&f.x>0&&f.x<W){f.dir*=-1;f.turnT=rnd(6,14);f.checked=false}
    }
    f.y=Math.max(f.y,PPM*1.5);
  }
  G.fish=G.fish.filter(f=>f.x>-f.L-160&&f.x<W+f.L+160&&f.y>G.camY-H*1.6&&f.y<G.camY+H*2.6);
  // kamera
  let cy=G.state==='idle'||G.state==='cast'?-H*.45:hk.y-H*.42;
  cy=Math.max(-H*.45,Math.min(cy,z.depth*PPM+70-H));
  G.camY=lerp(G.camY,cy,1-Math.pow(.02,dt));
  G.shake=Math.max(0,G.shake-dt*12);
  // cząsteczki
  for(const p of G.parts){p.t+=dt;if(p.kind==='drop'){p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}else if(p.kind==='bub'){p.y-=40*dt;p.x+=Math.sin(p.t*4)*10*dt}}
  G.parts=G.parts.filter(p=>p.kind==='drop'?p.y<4:p.kind==='bub'?p.t<3:p.t<1);
  if(G.state==='fight'&&Math.random()<dt*8)G.parts.push({kind:'bub',x:hk.x+rnd(-10,10),y:hk.y,t:0});
  // przycisk
  const lbl=G.state==='idle'?'ZARZUĆ':G.state==='fight'?'KRĘĆ!':'KRĘĆ';
  if(RB.textContent!==lbl)RB.textContent=lbl;
}

// ================== RYSOWANIE ŚWIATA ==================
const WSTOPS=[[0,'#3fb6e0'],[25,'#1f8cc4'],[90,'#105a96'],[250,'#0a3264'],[520,'#051a3d'],[1000,'#020812'],[1500,'#06031c'],[2000,'#04010f']];
function waterCol(d){d=Math.max(0,d);for(let i=1;i<WSTOPS.length;i++){if(d<=WSTOPS[i][0]){const[a,ca]=WSTOPS[i-1],[b,cb]=WSTOPS[i];return mixHex(ca,cb,(d-a)/(b-a))}}return WSTOPS[WSTOPS.length-1][1]}
function waveY(x,t){return Math.sin(x*.018+t*1.6)*3.5+Math.sin(x*.047-t*1.1)*1.6}

  c.fillStyle='#e04a3a';c.beginPath();c.arc(x,y-12,3.5,0,7);c.fill();
}
function render(){
  const t=G.t,c=ctx;
  c.setTransform(DPR,0,0,DPR,0,0);
  const sh=G.shake;if(sh>0)c.translate(rnd(-sh,sh),rnd(-sh,sh));
  const sy=-G.camY;
  if(sy>0){c.fillStyle='#000';c.fillRect(0,0,W,sy)}
  drawSky(c,sy,t);
  drawWater(c,sy,t);
  drawSeabed(c,t);
  const hk=G.hook,hsy=hk.y-G.camY,dark=clamp((G.camY/PPM+H*.42/PPM-70)/450,0,.88)*(1-.07*S.lamp);
  EYEGLOW=dark;
  // światło lampy
  if(dark>.05&&G.state!=='idle'){const lg=c.createRadialGradient(hk.x,hsy,0,hk.x,hsy,200*LAMPS[S.lamp].r);lg.addColorStop(0,`rgba(255,240,190,${.22*dark+.05})`);lg.addColorStop(1,'rgba(255,240,190,0)');c.save();c.globalCompositeOperation='lighter';c.fillStyle=lg;c.beginPath();c.arc(hk.x,hsy,200*LAMPS[S.lamp].r,0,7);c.fill();c.restore()}
  // ryby (najpierw duże)
  const list=G.fight?[...G.fish,G.fight.f]:G.fish;
  list.sort((a,b)=>b.L-a.L);
  for(const f of list){
    const fy=f.y-G.camY;if(fy<-f.L||fy>H+f.L)continue;
    const dist=Math.hypot(f.x-hk.x,fy-hsy);
    let a=1-dark*.9*clamp((dist-140*LAMPS[S.lamp].r)/(420*LAMPS[S.lamp].r),0,1);
    if(f.sp.photo||f.sp.s==='zabnica')a=Math.max(a,.6);
    if(f.sp.boss)a=Math.max(a,.42);
    c.save();c.globalAlpha=Math.max(.06,a);c.translate(f.x,fy);
    const hooked=G.fight&&G.fight.f===f;
    if(hooked&&G.fight.thrash>0)c.rotate(Math.sin(t*30)*.12);
    else if(hooked)c.rotate(-.15*f.dir);
    c.scale(f.dir,1);
    drawFish(c,f.sp,f.L,f.t);
    c.restore();
  }
  c.globalAlpha=1;
  if(dark>.25){c.save();c.globalCompositeOperation='lighter';
    for(let i=0;i<70;i++){const x=(hash(i)*W+Math.sin(t*.3+i)*12)%W,y=((hash(i+99)*H*1.5-G.camY*.8)%(H*1.5)+H*1.5)%(H*1.5)-H*.25,a=dark*Math.max(0,Math.sin(t*1.7+i*3.1));
      if(a<.05)continue;const col=i%3?'120,255,230':'140,180,255';c.fillStyle=`rgba(${col},${a*.25})`;c.beginPath();c.arc(x,y,5,0,7);c.fill();c.fillStyle=`rgba(${col},${a})`;c.beginPath();c.arc(x,y,1.5,0,7);c.fill()}
    c.restore()}
  // żyłka
  const tsy=tip.y-G.camY;
  if(G.state!=='idle'){
    const tn=G.fight?G.fight.tension/100:0;
    c.strokeStyle=tn>.75?`rgba(255,${180-tn*120|0},${160-tn*120|0},.95)`:'rgba(235,245,250,.75)';c.lineWidth=tn>.75?1.6:1.1;
    c.beginPath();c.moveTo(tip.x,tsy);
    const sag=G.fight?0:G.state==='cast'?0:30;
    c.quadraticCurveTo((tip.x+hk.x)/2+sag,(tsy+hsy)/2+sag*.5,hk.x,G.fight?hsy:hsy-12);c.stroke();
    if(G.state!=='fight')drawHook(c,hk.x,hsy);
  }
  // cząsteczki
  for(const p of G.parts){const py=p.y-G.camY;
    if(p.kind==='drop'){c.fillStyle='rgba(220,245,255,.85)';c.beginPath();c.arc(p.x,py,2.2,0,7);c.fill()}
    else if(p.kind==='bub'){c.strokeStyle='rgba(220,245,255,.6)';c.lineWidth=1;c.beginPath();c.arc(p.x,py,2+p.t,0,7);c.stroke()}
    else if(p.kind==='ring'){c.strokeStyle=`rgba(255,255,255,${.7*(1-p.t)})`;c.lineWidth=2;c.beginPath();c.ellipse(p.x,py+2,10+p.t*60,3+p.t*8,0,0,7);c.stroke()}
    else if(p.kind==='excl'){c.fillStyle=`rgba(255,201,74,${1-p.t})`;c.font='800 40px "Baloo 2",sans-serif';c.textAlign='center';c.fillText('!',p.x,py-30-p.t*30)}}
  // łódź i powierzchnia
  if(sy>-200){drawBoat(c,boatX,sy,t);
    const hw=[62,80,100,150,165][S.boat];c.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<14;i++){const u=i/13,x=boatX-hw+u*hw*2+Math.sin(t*2+i)*3,y=sy+5+Math.sin(t*3+i*1.7)*1.5;c.beginPath();c.ellipse(x,y,6+hash(i)*6,2.2,0,0,7);c.fill()}
    if(Z().id!==2){const sx=W*.8;for(let i=0;i<34;i++){const a=Math.max(0,Math.sin(t*3+i*7.3));if(a<.3)continue;const x=sx+(hash(i*4.1)-.5)*360,y=sy+waveY(x,t)+2+hash(i)*10;c.fillStyle=`rgba(255,250,225,${a*.9})`;c.fillRect(x-3,y,6*a,1.6)}}
    c.fillStyle='rgba(63,182,224,.55)';c.beginPath();c.moveTo(0,sy+14);for(let x=0;x<=W+10;x+=10)c.lineTo(x,sy+3+waveY(x+40,t+1)*.8);c.lineTo(W,sy+14);c.fill();
    c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1.5;c.beginPath();for(let x=0;x<=W+10;x+=10)x?c.lineTo(x,sy+waveY(x,t)):c.moveTo(x,sy+waveY(x,t));c.stroke()}
  c.setTransform(DPR,0,0,DPR,0,0);
  const vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(2,10,24,0)');vg.addColorStop(1,`rgba(2,10,24,${.3+dark*.35})`);c.fillStyle=vg;c.fillRect(0,0,W,H);
  drawUI(c);
}
function drawUI(c){
  const z=Z(),md=maxDepth(),hk=G.hook;
  // wskaźnik głębokości
  const gx=Math.max(14,innerWidth<520?12:20),gy0=110,gy1=H-150;
  if(gy1-gy0>80){
    c.fillStyle='rgba(4,24,44,.6)';c.fillRect(gx,gy0,8,gy1-gy0);
    const lim=z.depth;const yl=gy0+(gy1-gy0)*Math.min(1,LINES[S.line].d/lim);
    c.fillStyle='rgba(95,211,154,.35)';c.fillRect(gx,gy0,8,yl-gy0);
    const yh=gy0+(gy1-gy0)*clamp(hk.d/lim,0,1);
    c.fillStyle='#ffc94a';c.beginPath();c.moveTo(gx+10,yh);c.lineTo(gx+20,yh-6);c.lineTo(gx+20,yh+6);c.fill();
    c.font='800 13px Nunito,sans-serif';c.textAlign='left';c.fillStyle='#eaf6ff';
    c.fillText(`${Math.round(hk.d)} m`,gx+24,yh+4);
    c.fillStyle='#93b6cf';c.font='800 11px Nunito,sans-serif';c.fillText('0 m',gx+12,gy0+4);c.fillText(`dno ${lim} m`,gx+12,gy1+14);
    if(LINES[S.line].d<lim)c.fillText(`żyłka ${LINES[S.line].d} m`,gx+12,yl+4);
  }
  // walka
  if(G.state==='fight'){
    const F=G.fight,bw=Math.min(340,W-60),bx=(W-bw)/2,by=H-(innerWidth<520?150:90)-((window.visualViewport&&0)||0);
    const known=!!S.atlas[F.f.sp.id];
    c.textAlign='center';c.font='800 26px "Baloo 2",sans-serif';c.fillStyle='#fff';c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=4;
    const nm=known?F.f.sp.n:'??? ('+(F.f.w>500?'GIGANT':F.f.w>50?'coś ciężkiego':'coś się szarpie')+')';
    c.strokeText(nm,W/2,by-34);c.fillText(nm,W/2,by-34);
    c.font='800 14px Nunito,sans-serif';const dtxt=`Do powierzchni: ${Math.max(0,Math.round(F.dist))} m`;c.strokeText(dtxt,W/2,by-12);c.fillText(dtxt,W/2,by-12);
    c.fillStyle='rgba(4,24,44,.85)';rr(c,bx-4,by-4,bw+8,30,10);c.fill();
    const g=c.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#5fd39a');g.addColorStop(.6,'#ffc94a');g.addColorStop(.85,'#ff6b5a');g.addColorStop(1,'#d42a2a');
    c.fillStyle=g;rr(c,bx,by,bw*clamp(F.tension/100,0,1),22,7);c.fill();
    c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;c.beginPath();c.moveTo(bx+bw*.85,by-2);c.lineTo(bx+bw*.85,by+24);c.stroke();
    c.font='900 12px Nunito,sans-serif';c.lineWidth=3;c.strokeStyle='rgba(4,24,44,.9)';c.fillStyle='#fff';const tt=F.thrash>0?'RYBA SIĘ RZUCA — PUŚĆ!':'NAPIĘCIE ŻYŁKI';c.strokeText(tt,W/2,by+16);c.fillText(F.thrash>0?'RYBA SIĘ RZUCA — PUŚĆ!':'NAPIĘCIE ŻYŁKI',W/2,by+16);
  }
  // podpowiedź
  let hint='';
  if(G.state==='idle')hint=innerWidth<700?'Dotknij, aby zarzucić wędkę':'Kliknij lub naciśnij spację albo K, aby zarzucić wędkę';
  else if(G.state==='line'&&S.casts<6)hint=innerWidth<700?'Przesuwaj palcem, by sterować haczykiem · KRĘĆ zwija żyłkę':'Ruszaj myszką, by sterować haczykiem · przytrzymaj przycisk myszy (lewy lub prawy) albo K, by zwijać';
  else if(G.state==='fight'&&S.casts<10)hint='Trzymaj, aby zwijać — puść, gdy napięcie rośnie!';
  if(hint){c.textAlign='center';c.font='800 15px Nunito,sans-serif';const y=G.state==='fight'?H-(innerWidth<520?190:130)-30:H-40;const w=c.measureText(hint).width+28;
    if(G.state!=='fight'){c.fillStyle='rgba(4,24,44,.7)';rr(c,W/2-w/2-(innerWidth<520?50:0),y-20,w,30,15);c.fill();c.fillStyle='#eaf6ff';c.fillText(hint,W/2-(innerWidth<520?50:0),y)}}
}
function rr(c,x,y,w,h,r){r=Math.min(r,h/2,Math.max(0,w)/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

// ================== HUD I OKNA ==================
function updHud(){$('coins').textContent=fmt(S.coins);$('locname').textContent=Z().name;$('bSnd').textContent=S.snd?'♪':'✕';$('bSnd').setAttribute('aria-pressed',S.snd?'true':'false')}
let toastT=0;
function toast(msg,warn){const el=$('toast');el.textContent=msg;el.classList.toggle('warn',!!warn);el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}
const modalOpen=()=>!$('modal').hidden;
function openModal(title,html,after){$('mTitle').textContent=title;$('mBody').innerHTML=html;$('modal').hidden=false;pHold=bHold=kHold=false;if(after)after()}
function closeModal(){$('modal').hidden=true;if(onClose){const f=onClose;onClose=null;f()}}
let onClose=null;
$('mClose').onclick=closeModal;
$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});

const CATS=[
  {k:'rod',t:'Wędka',a:RODS,st:i=>`siła ${RODS[i].p}`},
  {k:'line',t:'Żyłka',a:LINES,st:i=>`zasięg ${LINES[i].d} m`},
  {k:'reel',t:'Kołowrotek',a:REELS,st:i=>`zwijanie ${REELS[i].s} m/s`},
  {k:'bait',t:'Przynęta',a:BAITS,st:i=>`przyciąga: ${BAITS[i].d}`},
  {k:'hook',t:'Haczyk',a:HOOKS,st:i=>`branie ${Math.round(HOOKS[i].a*100)}% · zasięg wabienia ×${HOOKS[i].r.toLocaleString('pl-PL')}`},
  {k:'brake',t:'Hamulec',a:BRAKES,st:i=>`napięcie żyłki −${Math.round((1-BRAKES[i].f)*100)}%`},
  {k:'lamp',t:'Lampa',a:LAMPS,st:i=>`zasięg światła ×${LAMPS[i].r.toLocaleString('pl-PL')}`},
  {k:'market',t:'Targ rybny',a:MARKETS,st:i=>`ceny ryb ×${MARKETS[i].m.toLocaleString('pl-PL')}`},
];
function shopHtml(){
  return `<p style="margin:0;color:var(--muted);font-size:14px">Mocniejsza wędka mniej napina żyłkę, dłuższa żyłka sięga głębiej, a lepsza przynęta wabi większe ryby.</p>`+CATS.map(cat=>{
    const cur=S[cat.k],nx=cur+1,a=cat.a,n=a[nx];
    return `<div class="up"><h3>${cat.t}</h3><div class="pips">${a.map((_,i)=>`<i class="${i<=cur?'on':''}"></i>`).join('')}</div>
      <div class="now">Teraz: <b>${a[cur].n}</b> · ${cat.st(cur)}</div>
      ${n?`<div class="nxt">Następna: <b>${n.n}</b> · ${cat.st(nx)}</div><div class="buy"><span></span><button type="button" data-k="${cat.k}" ${S.coins<n.c?'disabled':''}>Kup za ${fmt(n.c)}</button></div>`
        :`<div class="buy"><span class="maxed">Najlepsza możliwa!</span></div>`}</div>`}).join('');
}
function openShop(){openModal('Sklep wędkarski',shopHtml(),bindShop)}
function bindShop(){$('mBody').querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,cat=CATS.find(c=>c.k===k),n=cat.a[S[k]+1];if(!n||S.coins<n.c)return;S.coins-=n.c;S[k]++;save();updHud();SFX.buy();toast(`Kupiono: ${n.n}`);$('mBody').innerHTML=shopHtml();bindShop()})}
function mapHtml(){
  return ZONES.map(z=>{const own=S.boat>=z.id,here=S.loc===z.id,next=z.id===S.boat+1;
    const nF=SP.filter(s=>s.z.includes(z.id)),nK=nF.filter(s=>S.atlas[s.id]).length;
    let btn=here?`<button class="act" type="button" disabled>Tu jesteś</button>`:own?`<button class="act" type="button" data-go="${z.id}">Płyń</button>`:next?`<button class="act" type="button" data-buy="${z.id}" ${S.coins<z.price?'disabled':''}>Kup za ${fmt(z.price)}</button>`:`<button class="act" type="button" disabled>Zablokowane</button>`;
    return `<div class="zone ${here?'here':''}"><div><div class="ztag">${z.boat}</div><h3>${z.name}</h3></div>${btn}<p>Dno na ${z.depth} m · gatunki odkryte: ${nK}/${nF.length}${z.id===3?' · tu żyją Mozazaur i Megalodon':z.id===4?' · tu czyhają Scylla, Charybda, Jormungand i Lewiatan':''}</p></div>`}).join('');
}
function openMap(){openModal('Mapa łowisk',mapHtml(),bindMap)}
function bindMap(){const b=$('mBody');
  b.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{travel(+x.dataset.go);closeModal()});
  b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>{const z=ZONES[+x.dataset.buy];if(S.coins<z.price)return;S.coins-=z.price;S.boat=z.id;save();SFX.buy();travel(z.id);toast(`Nowa łódź: ${z.boat}! Płyniemy na ${z.name}.`);closeModal()})}
function travel(id){S.loc=id;save();G.fish=[];G.fight=null;G.state='idle';G.hook.d=0;G.camY=-H*.45;updHud();for(let i=0;i<8;i++)spawnFish(true)}
function openAtlas(){
  const total=SP.length,known=SP.filter(s=>S.atlas[s.id]).length;
  let html=`<p style="margin:0;color:var(--muted);font-size:14px">Złowione gatunki: <b style="color:var(--ink)">${known} / ${total}</b>. Złów Mozazaura i Megalodona, aby zostać Łowcą Lewiatanów. Najtrudniejszy ze wszystkich jest Lewiatan z Otchłani Mitów.</p>`;
  ZONES.forEach(z=>{html+=`<div class="ahead">${z.name}</div><div class="agrid">`+SP.filter(s=>s.z[0]===z.id).map(s=>{const a=S.atlas[s.id];
    return `<div class="fc ${s.legend?'leg':''}"><canvas width="240" height="135" data-sp="${s.id}"></canvas><b>${a?s.n:'???'}</b><small>${a?`złowiono: ${a.n} · rekord ${fmtW(a.best)}`:`${s.d[0]}–${s.d[1]} m · przynęta: ${BAITS[s.b].n}`}</small></div>`}).join('')+`</div>`});
  openModal('Atlas ryb',html,()=>{$('mBody').querySelectorAll('canvas[data-sp]').forEach(cv=>fishThumb(cv,SPI[cv.dataset.sp],!!S.atlas[cv.dataset.sp]))});
}
function showCatch(f,price,isNew,isRec,won,bonus){
  const sp=f.sp;
  const tags=[isNew?'<span class="tag new">Nowy gatunek</span>':'',isRec?'<span class="tag rec">Rekord</span>':'',sp.legend?'<span class="tag leg">Legenda</span>':sp.boss?'<span class="tag leg">Gigant</span>':''].join('');
  openModal('Złowiono!',`<div class="catch"><canvas id="catchCv" width="560" height="280"></canvas><div class="tags">${tags}</div><div class="nm">${sp.n}</div>
    <div class="stats"><div>Waga<b>${fmtW(f.w)}</b></div><div>Złowione sztuki<b>${S.atlas[sp.id].n}</b></div><div>Zarobek<b style="color:var(--gold)">+${fmt(price)}</b></div>${bonus?`<div>Premia za odkrycie<b style="color:var(--kelp)">+${fmt(bonus)}</b></div>`:''}</div>
    ${won?'<div class="win">Złowiłeś Mozazaura i Megalodona! Jesteś prawdziwym Łowcą Lewiatanów. Łów dalej, by pobić rekordy.</div>':''}
    ${sp.id==='lewiatan'?'<div class="win">Pokonałeś LEWIATANA, najpotężniejszą istotę wszystkich mórz! Jesteś Władcą Oceanów.</div>':''}
    <button class="act" type="button" id="cOk">Łów dalej</button></div>`,()=>{
      const cc=$('catchCv');let t0=performance.now();
      const draw=()=>{if(!cc.isConnected)return;const c=cc.getContext('2d'),w=cc.width,h=cc.height;c.clearRect(0,0,w,h);const g=c.createRadialGradient(w/2,h/2,10,w/2,h/2,w*.6);g.addColorStop(0,'#1d5a8a');g.addColorStop(1,'rgba(11,44,72,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
        const extra=sp.s==='miecz'?1:sp.mega||sp.goblin?1.12:1;const L=Math.min(w*.78/extra,h/((sp.h||.3)*(sp.sail?3:sp.crest?4:sp.s==='zabnica'?2.6:2.2)));
        c.save();c.translate(w/2,h*.55);EYEGLOW=0;drawFish(c,sp,L,(performance.now()-t0)/1000);c.restore();requestAnimationFrame(draw)};draw();
      $('cOk').onclick=closeModal;$('cOk').focus();
    });
}
$('bShop').onclick=()=>{audioInit();openShop()};
$('bMap').onclick=()=>{audioInit();openMap()};
$('bAtlas').onclick=()=>{audioInit();openAtlas()};
$('bSnd').onclick=()=>{S.snd=S.snd?0:1;save();updHud();audioInit();if(S.snd)SFX.coin()};

function cheat(){if(location.hash==='#dwa-miliony'&&S.coins<2000000){S.coins=2000000;save();updHud();setTimeout(()=>toast('Masz 2 000 000 monet! Wydawaj w sklepie i na mapie.'),700)}}
cheat();addEventListener('hashchange',cheat);
updHud();
G.camY=-H*.45;boatX=W*.42;tip.x=boatX+60;tip.y=-80;
for(let i=0;i<8;i++)spawnFish(true);
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
if(!S.casts)setTimeout(()=>toast('Witaj, wędkarzu! Łów ryby, kupuj lepszy sprzęt i wypłyń na głębie, gdzie czają się prehistoryczne giganty.'),600);
</script>
