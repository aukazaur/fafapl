<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Lochy i Kostki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Grenze+Gotisch:wght@700;900&display=swap">
<style>
/* Layout: one-screen dungeon table. Monster on top in torchlight, a tray of carved bone dice at the bottom. Deliberately single dark theme. */
:root{
  --bg:#17120f; --stone:#241d18; --stone2:#32281f; --line:#4a3c2e;
  --bone:#f1e6cb; --bone2:#d5c39f; --ink:#f4ead4; --muted:#a8957a; --dark:#1c130c;
  --ember:#ff8f3f; --atk:#c93a25; --blk:#3a78bd; --heal:#cf3570; --fire:#e97412; --ice:#1a9fbb; --gold:#d9a521;
  --display:'Grenze Gotisch', Georgia, serif;
  --body:'Baloo 2', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 90% 55% at 50% -5%, #4a2a12 0%, rgba(74,42,18,0) 70%), var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.hurt{animation:hurt .35s}
@keyframes hurt{0%,100%{box-shadow:inset 0 0 0 0 rgba(201,58,37,0)}30%{box-shadow:inset 0 0 120px 20px rgba(201,58,37,.55)}}
#app{min-height:100%;box-sizing:border-box;max-width:580px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font-family:var(--body);font-size:16px;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
h1,h2{font-family:var(--display);font-weight:900;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(52px,14vw,84px);line-height:.9;color:var(--bone);text-shadow:0 3px 0 #000,0 0 30px rgba(255,143,63,.35)}
h1 em{font-style:normal;color:var(--ember)}
h2{font-size:34px;color:var(--bone);line-height:1}
p{margin:0}
.muted{color:var(--muted)}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:800;font-size:18px;background:var(--ember);color:var(--dark);box-shadow:0 4px 0 #8a3d0f;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #8a3d0f}
.btn.sec{background:var(--stone2);color:var(--ink);box-shadow:0 4px 0 #120d0a;border:1px solid var(--line)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;color:var(--bone)}
svg{display:block}
.c-atk{color:var(--atk)}.c-blk{color:var(--blk)}.c-heal{color:var(--heal)}.c-fire{color:var(--fire)}.c-ice{color:var(--ice)}.c-x2{color:var(--gold)}.c-none{color:var(--dark)}.c-buff{color:var(--gold)}.c-multi{color:var(--atk)}.c-drain{color:var(--heal)}
.c-dodge,.c-steal,.c-charge{color:var(--gold)}.c-web{color:#8a7a9c}.c-curse{color:#9a6fd6}.c-breath{color:var(--fire)}.c-poison{color:#7fbf3f}
.trait{font-size:13px;line-height:1.3;color:var(--muted);text-align:center;max-width:38ch;position:relative;z-index:1;margin:0}
.trait-s{font-size:13px;color:var(--ember)}
.die.stolen{opacity:.35;filter:grayscale(1)}
.die.stolen::after{content:"skradziona";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fl{display:flex;flex-direction:column;gap:3px;flex:1;min-width:140px}
.fl b{font-family:var(--display);font-size:22px;line-height:1;color:var(--bone)}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.setup{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%;max-width:520px}
.setup .label{font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--stone);border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;min-width:0;color:var(--ink)}
.chip small{font-size:12px;color:var(--muted);line-height:1.25}
.chip.on{border-color:var(--ember);background:var(--stone2)}
.hardchip.on{border-color:#c0391b;background:#3a1a10}
.pip{width:14px;height:8px;border-radius:2px;background:var(--stone2);border:1px solid var(--line)}
.pip.boss{width:20px;border-color:#7d3a1c}
.pip.done{background:var(--muted)}
.pip.now{background:var(--ember);border-color:var(--ember)}
.hp{display:flex;align-items:center;gap:5px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.hp svg{width:22px;height:22px;color:var(--heal)}

/* Arena */
.arena{position:relative;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.35)),var(--stone);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
.arena::after{content:"";position:absolute;left:15%;right:15%;bottom:62px;height:18px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px);z-index:0}
.intent{display:flex;align-items:center;gap:8px;background:var(--bone);color:var(--dark);border-radius:999px;padding:4px 14px 4px 8px;font-weight:800;position:relative;z-index:1}
.intent svg{width:26px;height:26px}
.intent .num{font-size:22px;font-variant-numeric:tabular-nums}
.intent small{font-weight:600;font-size:14px;color:#5b4a36}
.spr{image-rendering:pixelated;position:relative;z-index:1;max-width:100%;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.shake{animation:shake .4s!important}
@keyframes shake{20%{transform:translateX(-10px) rotate(-3deg);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.ename{font-family:var(--display);font-size:28px;line-height:1;color:var(--bone);position:relative;z-index:1}
.ename.elite{color:var(--ember)}
.bar{position:relative;width:min(280px,100%);height:20px;background:#120c08;border-radius:8px;border:1px solid var(--line);overflow:hidden;z-index:1}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#e2523b,#a52a18);transition:width .35s}
.bar span{position:relative;display:block;text-align:center;font-weight:800;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:28px;z-index:1}
.badge{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 6px;border-radius:999px;background:var(--stone2);border:1px solid var(--line);font-weight:700;font-size:14px}
.badge svg{width:18px;height:18px}

/* Player */
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.me .label{font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 10px;border-radius:18px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 9px),#3b2615;border:1px solid #5a3a1e;box-shadow:inset 0 6px 14px rgba(0,0,0,.5)}
.die{width:66px;height:66px;border-radius:14px;border:none;background:linear-gradient(155deg,var(--bone),var(--bone2));box-shadow:inset 0 -5px 0 rgba(0,0,0,.16),0 5px 0 rgba(0,0,0,.55);display:grid;place-items:center;position:relative;padding:0;transition:transform .15s}
.die svg{width:32px;height:32px}
.die .n{position:absolute;right:7px;bottom:1px;font-weight:800;font-size:19px;color:var(--dark)}
.die.locked{transform:translateY(-7px);box-shadow:0 0 0 3px var(--gold),0 9px 0 rgba(0,0,0,.55)}
.die.locked::after{content:"użyję";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.05em;white-space:nowrap}
.die.rolling{animation:wob .12s linear infinite}
@keyframes wob{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}100%{transform:rotate(-8deg)}}
.preview{text-align:center;font-weight:700;min-height:24px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
.preview span{display:inline-flex;align-items:center;gap:4px}
.preview svg{width:18px;height:18px}
.controls{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.hint{text-align:center;font-size:14px;color:var(--muted)}

/* Cards (doors, rewards) */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--stone);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:transform .12s,border-color .12s}
.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--ember)}
.card h3{margin:0;font-family:var(--display);font-size:26px;line-height:1;color:var(--bone)}
.card p{font-size:14px;color:var(--muted)}
.card .door{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:60px 60px 8px 8px;background:radial-gradient(ellipse at 50% 85%,rgba(255,143,63,.18),transparent 70%),#0e0907;border:4px solid #5a4632;display:grid;place-items:center;box-sizing:border-box}
.card.boss .door{border-color:#8a2a1a}
.tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:6px;background:var(--stone2);color:var(--muted)}
.tag.hot{background:#5a2010;color:#ffb27d}

.minifaces{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%}
.mf{aspect-ratio:1;border-radius:7px;background:linear-gradient(155deg,var(--bone),var(--bone2));display:grid;place-items:center;position:relative;border:none;padding:0;min-width:0}
.mf svg{width:58%;height:58%}
.mf b{position:absolute;right:3px;bottom:-2px;font-size:12px;color:var(--dark)}
button.mf:hover:not(:disabled){box-shadow:0 0 0 3px var(--gold)}
button.drow{color:inherit;font-family:var(--body);cursor:pointer}button.drow:hover{border-color:var(--ember)}
.dlist{display:flex;flex-direction:column;gap:10px}
.drow{background:var(--stone);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.drow .minifaces{max-width:360px}
.drow h4{margin:0;font-size:17px;color:var(--bone)}
.rare{color:var(--gold)}

.screen{display:flex;flex-direction:column;gap:16px}
.center{align-items:center;text-align:center}
.rules{background:var(--stone);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;max-width:520px}
.rules ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px;font-size:14px}
.legend div{display:flex;align-items:center;gap:6px}
.legend .mf{width:28px;flex:none}
.stack{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.overlay{position:fixed;inset:0;background:rgba(10,7,5,.85);z-index:20;overflow-y:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.float{position:fixed;z-index:30;font-weight:800;font-size:30px;pointer-events:none;text-shadow:0 2px 0 #000,0 0 8px #000;transform:translate(-50%,0);animation:up 1s ease-out forwards}
.float.dmg{color:#ff6b4f}.float.blk{color:#8cc2ff}.float.heal{color:#ff8fbd}.float.fire{color:#ffa94d}.float.ice{color:#7fe3f5}.float.gold{color:var(--gold)}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
@media (hover:none){.keys{display:none}}
@media (max-width:600px) and (max-height:820px){#spr{max-height:24vh;width:auto}.fight .ename{font-size:24px}}
@media (max-width:420px){.die{width:56px;height:56px}.die svg{width:27px;height:27px}.die .n{font-size:17px}}
@media (prefers-reduced-motion:reduce){.spr,.die.rolling,.shake{animation:none!important}.float{animation-duration:1.4s}}
</style>

<div id="app"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Ikony ---------- */
const ICON={
  atk:'<path d="M19 5 9.5 14.5M19 5h-4.5M19 5v4.5M6.5 11.5l6 6M9.5 14.5 4.5 19.5" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>',
  blk:'<path d="M12 3 19 6v5.5c0 4.6-3 7.8-7 9.5-4-1.7-7-4.9-7-9.5V6z" fill="currentColor" fill-opacity=".28" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>',
  heal:'<path d="M12 20.5s-7.8-4.7-7.8-10.5A4.3 4.3 0 0 1 12 7.5a4.3 4.3 0 0 1 7.8 2.5c0 5.8-7.8 10.5-7.8 10.5z" fill="currentColor"/>',
  fire:'<path d="M12 21.8c-3.9 0-6.6-2.7-6.6-6.3 0-4.3 4.3-6.7 4.6-11.4 2.7 1.6 4.8 4.2 5 7.1 1-.8 1.5-2 1.6-3.3 1.8 1.8 2.9 4.5 2.9 7.3 0 3.8-2.7 6.6-7.5 6.6z" fill="currentColor"/>',
  ice:'<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.3 4.4 12 7l2.7-2.6M9.3 19.6 12 17l2.7 2.6"/></g>',
  x2:'<path d="m12 2.6 2.8 5.8 6.3.8-4.6 4.4 1.2 6.3L12 16.8l-5.7 3.1 1.2-6.3-4.6-4.4 6.3-.8z" fill="currentColor"/>',
  none:'<circle cx="12" cy="12" r="2.6" fill="currentColor" opacity=".3"/>',
  multi:'<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 4 11 13M20 4h-4M20 4v4M13 4 4 13M13 4H9M13 4v4M6 14l4 4M7 17l-3 3"/></g>',
  buff:'<path d="M12 3.5 4.5 12H9v8.5h6V12h4.5z" fill="currentColor"/>',
};
ICON.drain=ICON.atk;
ICON.dodge='<path d="M3.5 17c3.5-8.5 10-11 16.5-9.5M15.5 3.5l4.5 4-4.2 4.6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
ICON.steal='<g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="12" height="12" rx="3"/><path d="m14.5 14.5 6 6m0-6-6 6"/></g>';
ICON.web='<g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/></g>';
ICON.curse='<path d="M12 3c-4.4 0-8 3.2-8 7.5 0 2.6 1.3 4.6 3 5.8V21h10v-4.7c1.7-1.2 3-3.2 3-5.8C20 6.2 16.4 3 12 3zm-3 6.2a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8zm6 0a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8z" fill="currentColor" fill-rule="evenodd"/>';
ICON.drop='<path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z" fill="currentColor"/>';
ICON.charge=ICON.fire;ICON.breath=ICON.fire;
const svg=t=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t]}</svg>`;
const FNAME={atk:'Atak',blk:'Tarcza',heal:'Leczenie',fire:'Ogień',ice:'Mróz',x2:'Podwójny atak',none:'Pusta ściana'};
const FDESC={atk:'zadaje obrażenia',blk:'blokuje cios potwora',heal:'przywraca zdrowie',fire:'podpala: potwór traci życie co turę',ice:'osłabia każdy cios potwora w jego turze',x2:'podwaja cały atak z tej tury',none:'nic nie robi'};
const faceNum=f=>f.t==='x2'?'×2':f.t==='none'?'':f.n;

/* ---------- Kości ---------- */
const DICE={
  woj:{name:'Kość Wojownika',faces:[['atk',1],['atk',2],['atk',3],['atk',2],['blk',2],['blk',1]]},
  kap:{name:'Kość Kapłana',faces:[['heal',2],['heal',3],['blk',2],['blk',1],['atk',1],['none']]},
  ogn:{name:'Kość Ognia',faces:[['fire',2],['fire',2],['fire',3],['atk',2],['atk',1],['fire',1]]},
  mro:{name:'Kość Mrozu',faces:[['ice',2],['ice',3],['blk',3],['blk',2],['atk',2],['ice',2]]},
  szc:{name:'Kość Szczęścia',faces:[['x2'],['x2'],['atk',1],['atk',4],['none'],['none']]},
  ryc:{name:'Kość Rycerza',faces:[['blk',4],['blk',3],['blk',2],['atk',4],['atk',3],['atk',3]]},
  ber:{name:'Kość Berserkera',faces:[['atk',5],['atk',4],['atk',3],['none'],['none'],['none']]},
  zie:{name:'Kość Zielarza',faces:[['heal',3],['heal',2],['heal',2],['blk',1],['blk',1],['none']]},
  smo:{name:'Kość Smoka',rare:1,faces:[['fire',3],['fire',3],['atk',4],['atk',3],['x2'],['none']]},
  pal:{name:'Kość Paladyna',rare:1,faces:[['atk',3],['blk',3],['heal',3],['atk',4],['blk',4],['heal',2]]},
  zam:{name:'Kość Zamieci',rare:1,faces:[['ice',3],['ice',3],['ice',4],['blk',3],['atk',2],['atk',3]]},
  kro:{name:'Kość Królewska',rare:1,faces:[['x2'],['atk',5],['atk',4],['atk',4],['blk',3],['heal',3]]},
  wam:{name:'Kość Wampira',rare:1,faces:[['atk',3],['heal',3],['atk',4],['heal',2],['atk',2],['fire',2]]},
};
const COMMON=Object.keys(DICE).filter(k=>!DICE[k].rare&&k!=='woj'&&k!=='kap');
const RARE=Object.keys(DICE).filter(k=>DICE[k].rare);
const mk=id=>({id,name:DICE[id].name,rare:!!DICE[id].rare,faces:DICE[id].faces.map(([t,n])=>({t,n:n||0}))});
const MAXDICE=8, MAXSLOTS=4;
const slotWord=n=>n===1?'kość':n<5?'kości':'kości';

/* ---------- Potwory ---------- */
const EN={
  szlam:{name:'Szlam',hp:12,spr:'slime',trait:'grow',tr:'Rośnie: po każdej swojej turze bije o 1 mocniej. Pokonaj go szybko!',moves:[['atk',3],['atk',2],['blk',4]]},
  nietop:{name:'Nietoperz',hp:10,spr:'bat',tr:'Unik: gdy szykuje unik, twoje ataki nie trafiają. Ogień i mróz działają.',moves:[['multi',2,2],['dodge',3],['atk',3]]},
  szczur:{name:'Szczur',hp:11,spr:'rat',trait:'poison',tr:'Trujące zęby: gdy cię zrani, zatruwa cię. Trucizna zabiera HP na początku twoich tur.',moves:[['atk',3],['buff',1],['atk',4]]},
  szkiel:{name:'Szkielet',hp:15,spr:'skel',trait:'revive',tr:'Odrodzenie: raz po pokonaniu wstaje z 40% życia.',moves:[['atk',7],['blk',5],['atk',6]]},
  goblin:{name:'Goblin',hp:15,spr:'gob',tr:'Złodziej: potrafi ukraść ci jedną kość na następną turę.',moves:[['multi',3,2],['steal',4],['atk',6]]},
  pajak:{name:'Pająk',hp:15,spr:'spider',tr:'Sieć: po ataku siecią w następnej turze nie możesz przerzucać kości.',moves:[['multi',2,3],['web',5],['blk',4]]},
  upior:{name:'Upiór',hp:28,spr:'ghost',trait:'ghost',tr:'Bezcielesny: jego ciosy przenikają przez tarczę. Pomaga mróz.',moves:[['atk',7],['heal',5],['multi',2,3]]},

  cv.width=W*sc; cv.height=H*sc;

  s.map.forEach((row,y)=>{const off=Math.floor((W-row.length)/2);[...row].forEach((c,x)=>{

  })});
}

function tone(f,d,type='square',to=null,vol=.06,delay=0){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function makeDoors(f){
  const L=(S&&S.len)||10;
  if(f===5) return [{k:'boss',en:pick(['krol','krolowa','hrabia']),anc:L===5?1:0}];
  if(f===10){const en=pick(['smok','lisz','tytan']);S.boss10=en;return [{k:'boss',en}]}
  if(f===15) return [{k:'boss',en:pick(['smok','lisz','tytan'].filter(x=>x!==S.boss10)),anc:1}];
  const opts=['fight','fight','fight'];
  if(f>=2) opts.push('elite','camp');
  if(f>=3) opts.push('chest');
  const a=pick(opts); let b=pick(opts);
  while(b===a&&a!=='fight') b=pick(opts);
  const tier=tierFor(f);
  const d=[a,b].map(k=>({k,en:(k==='fight'||k==='elite')?pick(tier):null}));
  if(d[0].k===d[1].k&&d[0].en===d[1].en){const o=tier.filter(x=>x!==d[0].en);d[1].en=pick(o)}
  return d;
}

async function enterDoor(i){

  if(S.log)S.log.doors.push({f:S.floor,opts:S.doors.map(x=>x.k+(x.en?':'+x.en:'')),took:i});
  if(d.k==='camp'){S.scr='camp';return render()}
  if(d.k==='chest'){S.reward=makeReward('chest');S.scr='reward';return render()}
  S.en=makeEnemy(d.en,d.k==='elite',S.floor,d.anc);
  S.fightKind=d.k;
  S.poison=0;S.stealNext=S.webNext=S.curseNext=false;S.stolen=-1;S.webbed=S.cursed=false;
  if(S.log)S.log.fights.push({f:S.floor,en:d.en,el:d.k==='elite'?1:0,hp0:S.hp,max:S.maxHp,slots:S.slots,nDice:S.dice.length,t:[]});
  S.scr='fight';

}
async function startTurn(){
  S.block=0;S.rr=0;S.lock=S.dice.map(()=>false);S.phase='roll';
  S.webbed=!!S.webNext;S.rerolls=S.webbed?0:2;S.webNext=false;
  S.cursed=!!S.curseNext;S.curseNext=false;
  S.stolen=S.stealNext?rnd(S.dice.length):-1;S.stealNext=false;
  S.roll=S.dice.map(()=>rnd(6));
  if(S.poison>0){
    const p=S.poison;S.hp=Math.max(0,S.hp-p);S.poison--;
    render();sfx('hurt');hurtFlash();float('#mehp','trucizna −'+p,'dmg');
    await sleep(600);
    if(S.hp<=0) return lose();
  }
  await rollDice(S.dice.map((_,i)=>i));
}
async function enemyDeadCheck(){
  const e=S.en;
  if(e.trait==='split'&&!e.split&&e.hp>0&&e.hp<=e.max/2){
    e.split=true;if(e.p2)e.moves=e.p2;e.mi=0;e.block+=6;if(S.hard)e.hp=Math.min(e.max,e.hp+10);
    render();sfx('block');shake('#spr');float('#spr','dzieli się!','gold');await sleep(700);
  }
  if(e.hp>0) return false;
  if(e.trait==='revive'&&!e.revived){
    e.revived=true;e.hp=Math.round(e.max*.4);
    render();sfx('heal');float('#spr','wstaje z martwych!','gold');await sleep(800);return false;
  }
  return true;
}
async function rollDice(idx){
  S.busy=true;S.rolling=idx;sfx('roll');
  const t0=performance.now();
  while(performance.now()-t0<450){idx.forEach(i=>S.roll[i]=rnd(6));render();await sleep(70)}
  idx.forEach(i=>S.roll[i]=rnd(6));
  S.rolling=null;S.busy=false;render();
}
function reroll(){
  if(S.busy||S.phase!=='roll'||S.rerolls<=0) return;
  const idx=S.dice.map((_,i)=>i).filter(i=>!S.lock[i]&&i!==S.stolen);
  if(!idx.length) return;
  S.rerolls--;S.rr=(S.rr||0)+1;rollDice(idx);
}
function toggleLock(i){
  if(S.busy||S.phase!=='roll') return;
  if(i===S.stolen){sfx('block');float('.tray','Tę kość ukradł Goblin!','gold');return}
  if(!S.lock[i]&&S.lock.filter(Boolean).length>=slotsNow()){
    sfx('block');float('.tray','Możesz użyć tylko '+slotsNow()+' '+slotWord(slotsNow())+'!','gold');return;
  }
  S.lock[i]=!S.lock[i];sfx('click');render();
}
function totals(){
  const t={atk:0,blk:0,heal:0,fire:0,ice:0,x2:0};
  S.dice.forEach((d,i)=>{if(!S.lock[i])return;const f=d.faces[S.roll[i]];if(!f||f.t==='none')return;if(f.t==='x2')t.x2++;else t[f.t]+=f.n});
  t.base=t.atk;t.atk*=(1+t.x2);

}

}
function shake(sel){const el=$(sel);if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function hurtFlash(){document.body.classList.remove('hurt');void document.body.offsetWidth;document.body.classList.add('hurt')}

async function act(){
  if(S.busy||S.phase!=='roll') return;
  if(!S.lock.some(Boolean)){sfx('block');float('.tray','Najpierw wybierz kości!','gold');return}
  S.busy=true;S.phase='resolve';
  const t=totals(),e=S.en,cur=e.moves[e.mi];
  const turnRec=rollStr(),ehp0=e.hp;
  let atk=t.atk,dealt=0,absorbed=0,note='',spike=0;
  if(atk>0&&cur[0]==='dodge'){atk=0;note='unik!'}
  else if(atk>0&&e.trait==='armor'){atk=Math.max(0,atk-3);note='pancerz −3'}
  if(atk>0){absorbed=Math.min(e.block,atk);e.block-=absorbed;dealt=atk-absorbed;e.hp=Math.max(0,e.hp-dealt)}
  if(absorbed>0&&e.trait==='spikes'){spike=S.hard?absorbed:Math.ceil(absorbed/2);S.hp=Math.max(0,S.hp-spike)}
  S.block+=t.blk;
  const healed=S.hp>0?Math.min(t.heal,S.maxHp-S.hp):0;S.hp+=healed;
  const fireOk=e.trait!=='fireproof';
  if(fireOk)e.burn+=t.fire;
  e.frost+=t.ice;
  render();
  if(t.atk>0){sfx('hit');shake('#spr');if(dealt)float('#spr','-'+dealt,'dmg');if(absorbed)float('#spr','zablokował '+absorbed,'blk');if(note)float('#spr',note,'gold')}
  if(spike){sfx('hurt');hurtFlash();float('#mehp','kolce −'+spike,'dmg')}
  if(t.blk){sfx('block');float('#mehp','+'+t.blk+' tarczy','blk')}
  if(t.heal){sfx('heal');float('#mehp','+'+healed+' HP','heal')}
  if(t.fire){sfx('fire');float('#spr',fireOk?'ogień '+t.fire:'odporny na ogień!',fireOk?'fire':'gold')}
  if(t.ice){sfx('ice');float('#spr','mróz '+t.ice,'ice')}
  await sleep(750);
  if(S.hp<=0){logTurn(turnRec,ehp0-e.hp,0);return lose()}
  if(await enemyDeadCheck()){logTurn(turnRec,ehp0,0);return win()}

  // tura potwora
  if(e.burn>0){
    e.hp=Math.max(0,e.hp-e.burn);render();sfx('fire');shake('#spr');float('#spr','-'+e.burn,'fire');e.burn--;
    await sleep(600);render();
    if(await enemyDeadCheck()){logTurn(turnRec,ehp0,0);return win()}
  }
  const ehp1=e.hp,php1=S.hp;
  e.block=0;
  const m=e.moves[e.mi];
  if(HIT.includes(m[0])){
    const hits=hitsOf(e,m), per=m[1]+e.str, hpB=S.hp, pierce=e.trait==='ghost'||m[0]==='breath';
    if(m[0]==='breath'){sfx('fire');float('#spr','ZIEJE OGNIEM!','fire');await sleep(400)}
    for(let h=0;h<hits;h++){
      const fr=S.hard?Math.max(0,e.frost-h):e.frost;
      let d=per;const used=Math.min(fr,d);d-=used;
      const ab=pierce?0:Math.min(S.block,d);S.block-=ab;d-=ab;S.hp=Math.max(0,S.hp-d);
      if(d>0&&e.trait==='poison')S.poison=(S.poison||0)+2;
      render();
      if(d>0){sfx('hurt');hurtFlash();float('#mehp','-'+d+(pierce&&S.block?' przez tarczę':''),'dmg')}
      else{sfx('block');float('#mehp',used&&!ab?'zamrożone!':'zablokowane!','blk')}
      await sleep(hits>1?380:550);
      if(S.hp<=0) break;
    }
    if((m[0]==='drain'||e.trait==='drain')&&hpB>S.hp){const h=Math.min(hpB-S.hp,e.max-e.hp);if(h>0){e.hp+=h;render();sfx('heal');float('#spr','wysysa +'+h,'heal');await sleep(450)}}
    if(S.hp>0){
      if(e.trait==='poison'&&S.poison&&hpB>S.hp){float('#mehp','zatrucie '+S.poison,'gold');await sleep(350)}
      if(m[0]==='steal'){S.stealNext=true;sfx('click');float('#mehp','kradnie ci kość!','gold');await sleep(400)}
      if(m[0]==='web'){S.webNext=true;sfx('click');float('#mehp','sieć: bez przerzutów!','gold');await sleep(400)}
      if(m[0]==='curse'){S.curseNext=true;if(S.hard)S.webNext=true;sfx('lose');float('#mehp',S.hard?'klątwa: mniej kości i bez przerzutów!':'klątwa!','gold');await sleep(400)}
    }
  }else if(m[0]==='blk'){e.block=m[1];render();sfx('block');float('#spr','+'+m[1]+' tarczy','blk');await sleep(550)}
  else if(m[0]==='heal'){const h=Math.min(m[1],e.max-e.hp);e.hp+=h;render();sfx('heal');float('#spr','+'+h,'heal');await sleep(550)}
  else if(m[0]==='buff'){e.str+=m[1];render();sfx('fire');float('#spr','siła +'+m[1],'gold');await sleep(550)}
  else if(m[0]==='charge'){render();sfx('fire');float('#spr','nabiera powietrza…','fire');await sleep(650)}
  if(e.trait==='grow'&&S.hp>0){e.str++;render();float('#spr','rośnie! siła +1','gold');await sleep(450)}
  logTurn(turnRec,ehp0-ehp1,php1-S.hp);
  e.frost=0;
  e.mi=(e.mi+1)%e.moves.length;
  if(S.hp<=0) return lose();
  await startTurn();
}
function win(){
  sfx('win');S.busy=false;S.phase='';S.kills++;
  endFight(true);
  const e=S.en;
  if(S.floor===(S.len||10)){M.wins++;if(S.hard)M.hardWins=(M.hardWins||0)+1;M.best=Math.max(M.best,10);saveMeta();clearRun();if(S.log)S.log.result='wygrana';flush();S.scr='victory';return render()}
  let bonus=[];
  const rest=Math.min(3,S.maxHp-S.hp);if(rest>0){S.hp+=rest;bonus.push('+'+rest+' HP za zwycięstwo')}
  if(e.elite){S.maxHp+=5;S.hp=Math.min(S.maxHp,S.hp+5);bonus.push('+5 maks. HP')}
  if(e.boss){S.hp=S.maxHp;bonus.push('pełne zdrowie');if(S.slots<MAXSLOTS){S.slots++;bonus.push('+1 miejsce na kość w walce (teraz '+S.slots+')')}}
  S.reward=makeReward(e.boss||e.elite?'rare':'fight');S.reward.bonus=bonus;S.reward.title=e.name+(EN[e.id].fem?' pokonana!':' pokonany!');
  S.scr='reward';render();
}
function lose(){
  sfx('lose');S.busy=false;M.best=Math.max(M.best,S.floor);saveMeta();clearRun();
  endFight(false);if(S.log)S.log.result='porażka';flush();
  S.scr='dead';render();
}

/* ---------- Nagrody ---------- */
function makeReward(kind){
  const full=S.dice.length>=MAXDICE,opts=[];
  const pool=kind==='fight'?COMMON:kind==='rare'?RARE:shuffle(COMMON).slice(0,2).concat(RARE);
  const picks=shuffle(pool);
  if(kind==='chest'){
    if(full){opts.push({k:'die',id:picks[0]},{k:'die',id:picks[1]},{k:'maxhp',n:6})}
    else picks.slice(0,3).forEach(id=>opts.push({k:'die',id}));
    if(S.slots<MAXSLOTS&&Math.random()<.5) opts[opts.length-1]={k:'slot'};
    return {opts,title:'Skrzynia!',bonus:[]};
  }
  if(!full) picks.slice(0,2).forEach(id=>opts.push({k:'die',id}));
  else opts.push({k:'die',id:picks[0]},{k:'maxhp',n:6});
  opts.push({k:'up'});
  if(kind==='rare'&&S.slots<MAXSLOTS) opts.push({k:'slot'});
  return {opts,bonus:[]};
}
function takeReward(i){
  const o=S.reward.opts[i];if(!o)return;sfx('click');
  logReward(optName(o));
  if(o.k==='die'){if(S.dice.length>=MAXDICE){S.swapId=o.id;S.scr='swap';return render()}S.dice.push(mk(o.id));return nextFloor()}
  if(o.k==='maxhp'){S.maxHp+=o.n;S.hp+=o.n;return nextFloor()}
  if(o.k==='heal'){S.hp=Math.min(S.maxHp,S.hp+o.n);return nextFloor()}
  if(o.k==='up'){S.scr='upgrade';return render()}
  if(o.k==='slot'){S.slots=Math.min(MAXSLOTS,S.slots+1);return nextFloor()}
}
function upFace(d,f){
  const face=S.dice[d]&&S.dice[d].faces[f];if(!face||face.t==='x2')return;
  const before=fstr(face);
  if(face.t==='none'){face.t='atk';face.n=2}else face.n++;
  if(S.log)S.log.ups.push({f:S.floor,die:S.dice[d].id,face:before+'>'+fstr(face)});
  sfx('heal');nextFloor();
}
function rest(){logReward('odpoczynek',['odpoczynek','ulepszenie']);const h=Math.round(S.maxHp*.4);S.hp=Math.min(S.maxHp,S.hp+h);sfx('heal');nextFloor()}
function nextFloor(){
  S.floor++;M.best=Math.max(M.best,S.floor);saveMeta();
  if(S.floor===4&&S.slots<3){S.slots=3;S.notice='Zdobywasz pas bojowy! Od teraz używasz 3 kości w każdej turze.'}
  S.doors=makeDoors(S.floor);S.reward=null;S.en=null;S.scr='map';render();flush();
}

function mini(f,btn,attrs=''){
  const tag=btn?'button':'div';

}
function dieRow(d,di,mode){

    if(o.k==='die'){const d=DICE[o.id];
      return `<button class="card" data-a="take" data-i="${i}">${d.rare?'<span class="tag hot">rzadka</span>':'<span class="tag">nowa kość</span>'}
        <h3 class="${d.rare?'rare':''}">${d.name}</h3><div class="minifaces">${mk(o.id).faces.map(f=>mini(f)).join('')}</div>${S.dice.length>=MAXDICE?'<p>Plecak pełny: wymienisz ją na jedną ze swoich kości.</p>':''}</button>`}
    if(o.k==='up') return `<button class="card" data-a="take" data-i="${i}"><span class="tag">kowal</span><h3>Ulepsz ścianę</h3><p>Wybierz dowolną ścianę i dodaj jej +1. Pusta ściana zmieni się w atak 2.</p></button>`;
    if(o.k==='slot') return `<button class="card" data-a="take" data-i="${i}"><span class="tag hot">pas bojowy</span><h3>+1 miejsce</h3><p>W każdej turze użyjesz o jedną kość więcej (${S.slots} → ${S.slots+1}).</p></button>`;
    if(o.k==='maxhp') return `<button class="card" data-a="take" data-i="${i}"><span class="tag">eliksir</span><h3>+${o.n} maks. HP</h3><p>Więcej zdrowia na stałe.</p></button>`;
    if(o.k==='heal') return `<button class="card" data-a="take" data-i="${i}"><span class="tag">bandaże</span><h3>+${o.n} HP</h3><p>Ulecz rany przed następnym piętrem.</p></button>`;
  }).join('');
  return `${hud()}<div class="screen"><div><h2>${r.title||'Nagroda'}</h2>
    ${r.bonus&&r.bonus.length?`<p class="muted">Dostajesz: ${r.bonus.join(', ')}.</p>`:''}
    <p class="muted">Wybierz jedną nagrodę.</p></div>
    <div class="cards">${cards}</div>
    <div class="stack"><button class="ghost" data-a="skip">Pomiń</button></div></div>`;
}
function vUpgrade(){
  return `${hud()}<div class="screen"><div><h2>Kuźnia</h2><p class="muted">Kliknij ścianę, którą chcesz ulepszyć o +1. Pusta ściana zmieni się w atak 2. Ściany ×2 nie da się ulepszyć.</p></div>
    <div class="dlist">${S.dice.map((d,i)=>dieRow(d,i,'up')).join('')}</div></div>`;
}
function vSwap(){
  const nd=mk(S.swapId);
  return `${hud()}<div class="screen"><div><h2>Wymiana kości</h2><p class="muted">Plecak jest pełny. Kliknij kość, którą wyrzucasz, żeby zrobić miejsce na nową.</p></div>
    <div class="drow" style="border-color:var(--gold)"><h4 class="${nd.rare?'rare':''}">Nowa: ${nd.name}</h4><div class="minifaces">${nd.faces.map(f=>mini(f)).join('')}</div></div>
    <div class="dlist">${S.dice.map((d,i)=>`<button class="drow" data-a="swap" data-i="${i}" style="text-align:left"><h4 class="${d.rare?'rare':''}">Wyrzuć: ${d.name}</h4><div class="minifaces">${d.faces.map(f=>mini(f)).join('')}</div></button>`).join('')}</div>
    <div class="stack"><button class="ghost" data-a="swapcancel">Wróć do nagród</button></div></div>`;
}
function vCamp(){
  const h=Math.round(S.maxHp*.4);
  return `${hud()}<div class="screen center"><canvas class="spr" data-spr="camp" data-s="9"></canvas><h2>Ognisko</h2>
    <p class="muted">Ciepło i cicho. Co robisz?</p>
    <div class="cards" style="width:100%">
      <button class="card" data-a="rest"><span class="tag">sen</span><h3>Odpocznij</h3><p>Odzyskaj ${h} HP (do ${Math.min(S.maxHp,S.hp+h)}/${S.maxHp}).</p></button>
      <button class="card" data-a="campup"><span class="tag">kowal</span><h3>Ulepsz ścianę</h3><p>Dodaj +1 do jednej ściany dowolnej kości.</p></button>
    </div></div>`;
}
function vDead(){
  return `<div class="screen center" style="padding-top:30px"><canvas class="spr" data-spr="${S.en?S.en.spr:'skel'}" data-s="9"></canvas>
    <h1 style="font-size:58px">Koniec<br><em>wyprawy</em></h1>
    <p>Pokonał${S.en&&EN[S.en.id].fem?'a':''} cię ${S.en?S.en.name:'potwór'} na piętrze ${S.floor}.</p>
    <p class="muted">Pokonane potwory: ${S.kills} · Kości w plecaku: ${S.dice.length} · Rekord: piętro ${M.best}</p>
    <div class="stack"><button class="btn" data-a="new">Jeszcze raz</button><button class="btn sec" data-a="title">Menu</button></div></div>`;
}
function vVictory(){
  return `<div class="screen center" style="padding-top:30px"><canvas class="spr" data-spr="chest" data-s="12"></canvas>
    <h1 style="font-size:50px">${S.en?S.en.name:'Strażnik'}<br><em>${S.en&&EN[S.en.id].fem?'pokonana!':'pokonany!'}</em></h1>
    <p>Skarb z dna lochu jest twój.</p>
    <p class="muted">${S.hard?'<b style="color:#ffb27d">Tryb trudny!</b> · ':''}Pokonane potwory: ${S.kills} · Wygrane wyprawy: ${M.wins}${M.hardWins?` · W trybie trudnym: ${M.hardWins}`:''}</p>
    <div class="dlist" style="width:100%;text-align:left">${S.dice.map((d,i)=>dieRow(d,i)).join('')}</div>
    <div class="stack"><button class="btn" data-a="new">Nowa wyprawa</button><button class="btn sec" data-a="title">Menu</button></div></div>`;
}
function vBag(){
  return `<div class="overlay" data-a="closebag"><div class="inner" data-stop="1">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Plecak</h2><button class="ghost" data-a="closebag">Zamknij</button></div>
    <p class="muted">Masz ${S.dice.length} z ${MAXDICE} kości. W walce używasz ${S.slots} na turę.</p>
    <div class="dlist">${S.dice.map((d,i)=>dieRow(d,i)).join('')}</div>
    ${LEGEND()}
    <button class="ghost" data-a="mute">${muted?'Włącz dźwięk':'Wycisz dźwięk'}</button>
  </div></div>`;
}

function render(){
  const V={title:vTitle,map:vMap,fight:vFight,reward:vReward,upgrade:vUpgrade,swap:vSwap,camp:vCamp,dead:vDead,victory:vVictory}[S.scr]||vTitle;
  $('#app').innerHTML=V()+(bag&&S.dice?vBag():'');
  document.querySelectorAll('canvas[data-spr]').forEach(drawSprite);
  persist();
}

/* ---------- Sterowanie ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a],[data-stop]');if(!el)return;
  if(el.dataset.stop&&!ev.target.closest('[data-a]'))return;
  const a=el.dataset.a,i=+el.dataset.i;
  switch(a){
    case 'new':newRun(S.hard,S.len||10);break;
    case 'start':newRun(!!(M.wins&&M.prefHard),M.prefLen||10);break;
    case 'len':M.prefLen=i;saveMeta();sfx('click');render();break;
    case 'hardtoggle':M.prefHard=!M.prefHard;saveMeta();sfx('click');render();break;
    case 'newhard':if(M.wins)newRun(true);break;
    case 'cont':{const r=loadRun();if(r){S=r;S.busy=false;S.rolling=null;if(!S.log)S.log=newLog();if(S.scr==='fight'){startTurn()}else render()}break}
    case 'title':S={scr:'title'};render();break;
    case 'door':enterDoor(i);break;
    case 'lock':toggleLock(i);break;
    case 'reroll':reroll();break;
    case 'act':act();break;
    case 'take':takeReward(i);break;
    case 'skip':sfx('click');logReward('pominięto');nextFloor();break;
    case 'upface':upFace(+el.dataset.d,+el.dataset.f);break;
    case 'rest':rest();break;
    case 'swap':{if(S.swapId&&S.dice[i]){const old=S.dice[i].id;S.dice[i]=mk(S.swapId);if(S.log)S.log.ups.push({f:S.floor,swap:old+'>'+S.swapId});S.swapId=null;sfx('heal');nextFloor()}break}
    case 'swapcancel':S.swapId=null;S.scr='reward';render();break;
    case 'campup':sfx('click');logReward('ulepszenie',['odpoczynek','ulepszenie']);S.scr='upgrade';render();break;
    case 'bag':bag=true;sfx('click');render();break;
    case 'closebag':bag=false;render();break;
    case 'mute':muted=!muted;render();break;
  }
});
document.addEventListener('keydown',ev=>{
  if(bag&&ev.key==='Escape'){bag=false;render();return}
  if(S.scr!=='fight'||bag)return;
  if(/^[1-8]$/.test(ev.key)){const i=+ev.key-1;if(i<S.dice.length)toggleLock(i)}
  else if(ev.key==='r'||ev.key==='R'){reroll()}
  else if(ev.key==='Enter'&&!ev.target.closest('button')){ev.preventDefault();act()}
});

/* ---------- Start ---------- */
function start(data){
  if(data&&data.S&&data.S.scr){
    S=data.S;S.busy=false;S.rolling=null;if(S.dice&&!S.slots)S.slots=3;
    if(S.scr==='fight'&&S.phase!=='roll'){S.phase='roll'}
  }
  render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
